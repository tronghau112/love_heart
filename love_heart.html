<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>•͈ ₃ •͈꧞</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: crosshair;
        }
        canvas {
            border: none;
            background: black;
        }
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff69b4;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff69b4;
            z-index: 100;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-align: center;
            z-index: 100;
        }
        .tap-hint {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffb6d9;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff69b4;
            z-index: 1000;
            pointer-events: none;
            animation: hintPulse 1.6s ease-in-out infinite;
            transition: opacity 0.6s ease;
        }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="title">💗💗💗</div>
    <canvas id="heartCanvas"></canvas>
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
    <!-- <div class="controls">
        Giữ phím ← → để xoay | Tự động đập | Chạm màn hình để tạo sao và tim | Mưa sao băng trái tim
    </div> -->

    <script>
        let audioContext = null;
        let lastHeartbeatTime = 0;
        let heartbeatThreshold = 0.75; // Giảm ngưỡng kích hoạt nhịp tim, dễ kích hoạt hơn

        // Cách khởi tạo âm thanh tốt hơn
        function initAudioWithFeedback() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    console.log('Đã khởi tạo audio context');
                    
                    // Phát thử một âm thanh nhịp tim
                    setTimeout(() => {
                        if (audioContext) {
                            playHeartbeat();
                            console.log('Đã phát thử âm thanh nhịp tim');
                        }
                    }, 500);
                }
                return audioContext;
            } catch (error) {
                console.error('Khởi tạo âm thanh thất bại:', error);
                return null;
            }
        }

        // Âm thanh nhịp tim đơn giản (ổn định hơn)
        function playHeartbeat() {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            // Tiếng thứ nhất "lub" - âm trầm hơn
            createSimpleHeartbeat(now, 80, 0.1, 0.2);
            
            // Tiếng thứ hai "dub" - âm cao hơn chút, trễ 150ms
            setTimeout(() => {
                if (audioContext) {
                    createSimpleHeartbeat(audioContext.currentTime, 120, 0.08, 0.15);
                }
            }, 150);
        }

        // Hàm tạo âm thanh nhịp tim đơn giản
        function createSimpleHeartbeat(startTime, baseFreq, volume, duration) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            // Kết nối âm thanh đơn giản
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Đặt tần số nhịp tim
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(baseFreq, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, startTime + duration);
            
            // Đặt đường bao âm lượng
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        // Tạo buffer hiệu ứng vang
        function createReverbBuffer(duration, decay) {
            const sampleRate = audioContext.sampleRate;
            const length = sampleRate * duration;
            const impulse = audioContext.createBuffer(2, length, sampleRate);
            
            for (let channel = 0; channel < 2; channel++) {
                const channelData = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    const n = length - i;
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(n / length, decay);
                }
            }
            return impulse;
        }

        // Phiên bản 2: nhịp tim phong cách mơ màng (dự phòng)
        function playDreamyHeartbeat() {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            // Tạo âm thanh nhiều lớp
            for (let i = 0; i < 3; i++) {
                const delay = i * 0.02;
                const freq = 60 + i * 15;
                const vol = 0.04 - i * 0.01;
                
                setTimeout(() => {
                    if (audioContext) {
                        createDreamyTone(audioContext.currentTime, freq, vol);
                    }
                }, delay * 1000);
            }
        }

        function createDreamyTone(startTime, frequency, volume) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            const delay = audioContext.createDelay();
            const delayGain = audioContext.createGain();
            
            // Định tuyến âm thanh
            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Thêm hiệu ứng delay
            gainNode.connect(delay);
            delay.connect(delayGain);
            delayGain.connect(gainNode);
            
            // Cài đặt hiệu ứng delay
            delay.delayTime.setValueAtTime(0.1, startTime);
            delayGain.gain.setValueAtTime(0.2, startTime);
            
            // Cài đặt bộ lọc
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(frequency * 2, startTime);
            filter.Q.setValueAtTime(3, startTime);
            
            // Dùng sóng tam giác, mềm mại hơn
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(frequency, startTime);
            oscillator.frequency.linearRampToValueAtTime(frequency * 0.8, startTime + 0.2);
            
            // Đường bao âm lượng mềm mại
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + 0.4);
        }

        // Phiên bản 3: nhịp tim phong cách piano (thanh lịch)
        function playPianoHeartbeat() {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            // Phát nhịp tim dạng hợp âm
            const notes = [110, 138.59, 164.81]; // Hợp âm A2, C#3, E3
            
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    if (audioContext) {
                        createPianoNote(audioContext.currentTime, freq, 0.03 - index * 0.008);
                    }
                }, index * 30);
            });
        }

        function createPianoNote(startTime, frequency, volume) {
            // Sóng tổng hợp mô phỏng âm sắc piano
            const fundamental = audioContext.createOscillator();
            const harmonic2 = audioContext.createOscillator();
            const harmonic3 = audioContext.createOscillator();
            
            const gainNode = audioContext.createGain();
            const gain2 = audioContext.createGain();
            const gain3 = audioContext.createGain();
            const masterGain = audioContext.createGain();
            
            // Kết nối âm cơ bản
            fundamental.connect(gainNode);
            gainNode.connect(masterGain);
            
            // Kết nối bồi âm
            harmonic2.connect(gain2);
            gain2.connect(masterGain);
            harmonic3.connect(gain3);
            gain3.connect(masterGain);
            
            masterGain.connect(audioContext.destination);
            
            // Đặt tần số
            fundamental.frequency.setValueAtTime(frequency, startTime);
            harmonic2.frequency.setValueAtTime(frequency * 2, startTime);
            harmonic3.frequency.setValueAtTime(frequency * 3, startTime);
            
            // Đặt âm sắc
            fundamental.type = 'triangle';
            harmonic2.type = 'sine';
            harmonic3.type = 'sine';
            
            // Đặt âm lượng từng bè
            gainNode.gain.setValueAtTime(volume, startTime);
            gain2.gain.setValueAtTime(volume * 0.3, startTime);
            gain3.gain.setValueAtTime(volume * 0.1, startTime);
            
            // Đường bao âm lượng kiểu piano
            masterGain.gain.setValueAtTime(0, startTime);
            masterGain.gain.linearRampToValueAtTime(1, startTime + 0.01);
            masterGain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.1);
            masterGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);
            
            // Khởi động tất cả oscillator
            fundamental.start(startTime);
            harmonic2.start(startTime);
            harmonic3.start(startTime);
            
            fundamental.stop(startTime + 0.6);
            harmonic2.stop(startTime + 0.6);
            harmonic3.stop(startTime + 0.6);
        }

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        // Đặt kích thước canvas
        canvas.width = 800;
        canvas.height = 600;
        
        // Định nghĩa hằng số
        const WIDTH = 800;
        const HEIGHT = 600;
        const BLACK = [0, 0, 0];
        const PINK = [255, 105, 180];
        const LIGHT_PINK = [255, 182, 193];
        const HOT_PINK = [255, 20, 147];
        const GALAXY_COLORS = [[180, 200, 255], [120, 160, 255], [255, 255, 255], [200, 120, 255]];
        const STAR_COLORS = [[255, 255, 255], [255, 255, 180], [180, 255, 255], [255, 180, 255], [180, 255, 180]];
        
        // Biến toàn cục
        let angleY = 0;
        let pulse = 0;
        let lastTime = 0;
        let keys = {};
        
        // Kiểm tra có nằm trong trái tim 3D không
        function isIn3DHeart(x, z, y) {
            const scale = 0.7;
            x = x / scale;
            y = y / scale;
            z = z / scale;
            const term1 = (x * x + (9 * y * y) / 4.0 + z * z - 1);
            const value = term1 * term1 * term1 - x * x * z * z * z - (9 * y * y * z * z * z) / 80.0;
            return value <= 0;
        }
        
        // Hàm chọn ngẫu nhiên
        function randomChoice(arr, weights = null) {
            if (!weights) {
                return arr[Math.floor(Math.random() * arr.length)];
            }
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let random = Math.random() * totalWeight;
            for (let i = 0; i < arr.length; i++) {
                random -= weights[i];
                if (random <= 0) return arr[i];
            }
            return arr[arr.length - 1];
        }
        
        // Lớp hạt
        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                let x, y, z;
                do {
                    x = Math.random() * 3 - 1.5;
                    y = Math.random() * 3 - 1.5;
                    z = Math.random() * 3 - 1.5;
                } while (!isIn3DHeart(x, y, z));
                
                this.x = x * 12;
                this.y = y * 12;
                this.z = z * 12;
                this.dx = (Math.random() - 0.5) * 0.04;
                this.dy = (Math.random() - 0.5) * 0.04;
                this.dz = (Math.random() - 0.5) * 0.04;
                this.baseColor = randomChoice([PINK, LIGHT_PINK, HOT_PINK], [0.5, 0.3, 0.2]);
                this.baseSize = Math.random() * 1.7 + 1.5;
            }
            
            update(angleY, pulseScale) {
                this.x += this.dx;
                this.y += this.dy;
                this.z += this.dz;
                
                if (!isIn3DHeart(this.x / 12, this.y / 12, this.z / 12)) {
                    this.reset();
                }
                
                const xRot = this.x * Math.cos(angleY) + this.z * Math.sin(angleY);
                const zRot = -this.x * Math.sin(angleY) + this.z * Math.cos(angleY);
                const yRot = this.y;
                
                const scale = 25 * pulseScale;
                const distance = 20;
                const xProj = WIDTH / 2 + (xRot * scale);
                const yProj = HEIGHT / 2 - (yRot * scale);
                const depthFactor = (zRot + distance) / (2 * distance);
                
                const currSize = Math.max(2, this.baseSize * depthFactor * 1.5);
                const colorFactor = Math.min(1.0, Math.max(0.35, depthFactor * 1.6));
                
                const r = Math.min(255, Math.max(0, this.baseColor[0] * colorFactor));
                const g = Math.min(255, Math.max(0, this.baseColor[1] * colorFactor));
                const b = Math.min(255, Math.max(0, this.baseColor[2] * colorFactor));
                
                return {
                    x: xProj,
                    y: yProj,
                    size: currSize,
                    color: [r, g, b],
                    depth: depthFactor
                };
            }
            
            draw(ctx, angleY, pulseScale) {
                const result = this.update(angleY, pulseScale);
                if (result.x >= 0 && result.x < WIDTH && result.y >= 0 && result.y < HEIGHT) {
                    const alpha = 0.3 + 0.7 * result.depth;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = `rgb(${Math.floor(result.color[0])}, ${Math.floor(result.color[1])}, ${Math.floor(result.color[2])})`;
                    ctx.beginPath();
                    ctx.arc(result.x, result.y, result.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }
        
        // Lớp hạt dải ngân hà
        class GalaxyParticle {
            constructor() {
                this.x = Math.random() * WIDTH;
                this.y = Math.random() * HEIGHT;
                this.z = Math.random() * 60 - 30;
                this.size = Math.random() * 2 + 1;
                this.color = randomChoice(GALAXY_COLORS);
                this.baseAlpha = Math.random() * 208 + 12;
                this.alpha = this.baseAlpha;
                this.speed = Math.random() * 1 + 0.5;
                this.angle = Math.random() * 0.4 - 0.2;
                this.life = Math.random() * 60 + 60;
                this.fadeSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.angle) * 0.5;
                this.size = Math.max(0, this.size - this.fadeSpeed);
                this.life -= 1;
                
                if (this.life < 30) {
                    this.alpha = this.alpha * this.life / 30;
                }
                
                return this.life > 0 && this.y > 0 && this.size > 0;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha / 255;
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Lớp hạt rơi
        class ParticleDrop {
            constructor(heartParticles, angleY, pulse) {
                const sourceParticle = heartParticles[Math.floor(Math.random() * heartParticles.length)];
                const result = sourceParticle.update(angleY, pulse);
                this.x = result.x + (Math.random() - 0.5) * 160;
                this.y = result.y + 50;
                this.color = result.color;
                this.size = Math.random() * 1.5 + 1.5;
                this.speed = Math.random() * 2 + 1;
                this.alpha = Math.random() * 75 + 180;
                this.fadeSpeed = Math.random() * 1.5 + 1;
                this.horizontalSpeed = (Math.random() - 0.5);
                this.trail = [];
            }
            
            update() {
                this.y += this.speed;
                this.x += this.horizontalSpeed;
                this.alpha = Math.max(0, this.alpha - this.fadeSpeed);
                
                this.trail.push({
                    x: this.x,
                    y: this.y,
                    size: this.size,
                    alpha: this.alpha
                });
                
                if (this.trail.length > 5) {
                    this.trail.shift();
                }
                
                return this.alpha > 0 && this.y < HEIGHT + 20;
            }
            
            draw(ctx) {
                // Vẽ vệt đuôi
                this.trail.forEach((point, index) => {
                    const fade = point.alpha * (index + 1) / this.trail.length;
                    const size = Math.max(1, point.size * (index + 1) / this.trail.length);
                    
                    ctx.save();
                    ctx.globalAlpha = fade / 255;
                    ctx.fillStyle = `rgb(${Math.floor(this.color[0])}, ${Math.floor(this.color[1])}, ${Math.floor(this.color[2])})`;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
                
                // Vẽ hạt chính
                ctx.save();
                ctx.globalAlpha = this.alpha / 255;
                ctx.fillStyle = `rgb(${Math.floor(this.color[0])}, ${Math.floor(this.color[1])}, ${Math.floor(this.color[2])})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Lớp hạt trái tim mưa sao băng
        class FallingHeartParticle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * (WIDTH + 200) - 100; // Bắt đầu từ ngoài màn hình một chút
                this.y = -20; // Bắt đầu từ phía trên màn hình
                this.vx = (Math.random() - 0.7) * 2; // Hơi bay sang trái
                this.vy = Math.random() * 3 + 2; // Tốc độ rơi
                this.size = Math.random() * 12 + 8;
                this.color = randomChoice([PINK, LIGHT_PINK, HOT_PINK], [0.4, 0.4, 0.2]);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.trail = [];
                this.life = Math.random() * 200 + 300;
                this.maxLife = this.life;
                this.twinkle = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.twinkle += 0.15;
                this.life -= 1;
                
                // Thêm vệt đuôi
                this.trail.push({
                    x: this.x,
                    y: this.y,
                    size: this.size * 0.6,
                    alpha: this.alpha * 0.3
                });
                
                // Giới hạn độ dài vệt đuôi
                if (this.trail.length > 8) {
                    this.trail.shift();
                }
                
                // Nếu ra khỏi đáy màn hình, đặt lại lên đỉnh
                if (this.y > HEIGHT + 50 || this.x < -100 || this.x > WIDTH + 100 || this.life <= 0) {
                    this.reset();
                }
                
                return true;
            }
            
            draw(ctx) {
                // Vẽ vệt đuôi
                this.trail.forEach((point, index) => {
                    const trailAlpha = point.alpha * (index + 1) / this.trail.length;
                    const trailSize = point.size * (index + 1) / this.trail.length;
                    
                    ctx.save();
                    ctx.globalAlpha = trailAlpha;
                    ctx.translate(point.x, point.y);
                    ctx.scale(trailSize / 10, trailSize / 10);
                    
                    ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                    ctx.beginPath();
                    ctx.moveTo(0, 3);
                    ctx.bezierCurveTo(-5, -2, -10, 1, -5, 6);
                    ctx.bezierCurveTo(-3, 8, 0, 10, 0, 10);
                    ctx.bezierCurveTo(0, 10, 3, 8, 5, 6);
                    ctx.bezierCurveTo(10, 1, 5, -2, 0, 3);
                    ctx.fill();
                    
                    ctx.restore();
                });
                
                // Vẽ trái tim chính
                const twinkleEffect = 0.8 + 0.2 * Math.sin(this.twinkle);
                
                ctx.save();
                ctx.globalAlpha = this.alpha * twinkleEffect;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.size / 10, this.size / 10);
                
                // Hình trái tim
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.moveTo(0, 3);
                ctx.bezierCurveTo(-5, -2, -10, 1, -5, 6);
                ctx.bezierCurveTo(-3, 8, 0, 10, 0, 10);
                ctx.bezierCurveTo(0, 10, 3, 8, 5, 6);
                ctx.bezierCurveTo(10, 1, 5, -2, 0, 3);
                ctx.fill();
                
                // Hiệu ứng phát sáng
                ctx.globalAlpha = this.alpha * twinkleEffect * 0.3;
                ctx.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.shadowBlur = 15;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Lớp hạt ngôi sao khi chạm
        class ClickStarParticle {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 100;
                this.y = y + (Math.random() - 0.5) * 100;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - Math.random() * 3;
                this.size = Math.random() * 4 + 2;
                this.color = randomChoice(STAR_COLORS);
                this.life = Math.random() * 60 + 120;
                this.maxLife = this.life;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.twinkle = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // Trọng lực
                this.vx *= 0.99; // Lực cản
                this.life -= 1;
                this.rotation += this.rotationSpeed;
                this.twinkle += 0.2;
                
                return this.life > 0;
            }
            
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                const twinkleAlpha = alpha * (0.7 + 0.3 * Math.sin(this.twinkle));
                
                ctx.save();
                ctx.globalAlpha = twinkleAlpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Vẽ hình ngôi sao
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                
                // Sao 5 cánh
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const x = Math.cos(angle) * this.size;
                    const y = Math.sin(angle) * this.size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    const innerAngle = ((i + 0.5) * Math.PI * 2) / 5 - Math.PI / 2;
                    const innerX = Math.cos(innerAngle) * this.size * 0.4;
                    const innerY = Math.sin(innerAngle) * this.size * 0.4;
                    ctx.lineTo(innerX, innerY);
                }
                ctx.closePath();
                ctx.fill();
                
                // Thêm hiệu ứng phát sáng
                ctx.globalAlpha = twinkleAlpha * 0.3;
                ctx.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.shadowBlur = 10;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Lớp hạt trái tim khi chạm
        class ClickHeartParticle {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 50;
                this.y = y + (Math.random() - 0.5) * 50;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -Math.random() * 8 - 2;
                this.size = Math.random() * 8 + 6;
                this.color = randomChoice([PINK, LIGHT_PINK, HOT_PINK]);
                this.life = Math.random() * 40 + 80;
                this.maxLife = this.life;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15; // Trọng lực
                this.vx *= 0.98; // Lực cản
                this.life -= 1;
                this.rotation += this.rotationSpeed;
                
                return this.life > 0;
            }
            
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.size / 10, this.size / 10);
                
                // Vẽ hình trái tim
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.moveTo(0, 3);
                ctx.bezierCurveTo(-5, -2, -10, 1, -5, 6);
                ctx.bezierCurveTo(-3, 8, 0, 10, 0, 10);
                ctx.bezierCurveTo(0, 10, 3, 8, 5, 6);
                ctx.bezierCurveTo(10, 1, 5, -2, 0, 3);
                ctx.fill();
                
                // Thêm hiệu ứng phát sáng
                ctx.globalAlpha = alpha * 0.3;
                ctx.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.shadowBlur = 8;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Khởi tạo hệ thống hạt
        const particles = [];
        for (let i = 0; i < 3000; i++) {
            particles.push(new Particle());
        }
        
        let galaxyParticles = [];
        let dropParticles = [];
        let clickStars = [];
        let clickHearts = [];
        let fallingHearts = []; // Mới: mảng trái tim rơi
        
        // Khởi tạo trái tim rơi
        for (let i = 0; i < 15; i++) { // 15 trái tim, nhẹ hiệu năng
            fallingHearts.push(new FallingHeartParticle());
        }
        
        // Xử lý sự kiện bàn phím
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        // Xử lý sự kiện chạm
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Tạo hạt ngôi sao
            for (let i = 0; i < 15; i++) {
                clickStars.push(new ClickStarParticle(x, y));
            }
            
            // Tạo hạt trái tim
            for (let i = 0; i < 8; i++) {
                clickHearts.push(new ClickHeartParticle(x, y));
            }
        });
        
        // Vòng lặp animation chính
        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            // Xử lý input bàn phím
            if (keys['ArrowLeft']) {
                angleY -= 0.05;
            }
            if (keys['ArrowRight']) {
                angleY += 0.05;
            }
            
            // Tự động xoay và đập
            angleY += 0.01;
            
            // Tăng hiệu ứng đập - kết hợp sóng phức tạp hơn
            const time = currentTime * 0.001;
            const heartbeat1 = Math.sin(time * 4) * 0.15; // Nhịp tim chính
            const heartbeat2 = Math.sin(time * 8) * 0.05; // Nhịp tim phụ
            const slowPulse = Math.sin(time * 1.5) * 0.1; // Xung chậm
            const prevPulse = pulse;
            pulse = 0.85 + heartbeat1 + heartbeat2 + slowPulse;
               
            // Phát hiện đỉnh nhịp tim và phát âm thanh - sửa ở đây
            if (audioContext && pulse > heartbeatThreshold && prevPulse <= heartbeatThreshold) {
                const timeSinceLastBeat = currentTime - lastHeartbeatTime;
                if (timeSinceLastBeat > 400) { // Tránh phát âm thanh quá dày
                    // Chọn ngẫu nhiên loại âm thanh nhịp tim
                    const heartbeatType = Math.floor(Math.random() * 3);
                    switch(heartbeatType) {
                        case 0:
                            playHeartbeat();
                            break;
                        case 1:
                            playDreamyHeartbeat();
                            break;
                        case 2:
                            playPianoHeartbeat();
                            break;
                    }
                    lastHeartbeatTime = currentTime;
                }
            }

            // Xóa canvas
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            // Thêm hiệu ứng gradient
            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.restore();
            
            // Tạo hạt ngân hà mới
            if (Math.random() < 0.6) {
                galaxyParticles.push(new GalaxyParticle());
            }
            
            // Tạo hạt rơi mới
            if (dropParticles.length < 300 && Math.random() < 0.95) {
                dropParticles.push(new ParticleDrop(particles, angleY, pulse));
            }
            
            // Cập nhật và vẽ hạt ngân hà
            galaxyParticles = galaxyParticles.filter(p => p.update());
            galaxyParticles.forEach(p => p.draw(ctx));
            
            // Cập nhật và vẽ hạt rơi
            dropParticles = dropParticles.filter(p => p.update());
            dropParticles.forEach(p => p.draw(ctx));
            
            // Cập nhật và vẽ mưa sao băng trái tim
            fallingHearts.forEach(heart => {
                heart.update();
                heart.draw(ctx);
            });
            
            // Cập nhật và vẽ sao khi chạm
            clickStars = clickStars.filter(star => star.update());
            clickStars.forEach(star => star.draw(ctx));
            
            // Cập nhật và vẽ tim khi chạm
            clickHearts = clickHearts.filter(heart => heart.update());
            clickHearts.forEach(heart => heart.draw(ctx));
            
            // Vẽ hạt trái tim
            particles.forEach(particle => {
                particle.draw(ctx, angleY, pulse);
            });
            
            requestAnimationFrame(animate);
        }

        // Nhạc nền: phát music.mp3 khi chạm lần đầu, không có file thì dùng âm thanh nhịp tim
        const bgMusic = document.getElementById('bgMusic');
        const tapHint = document.getElementById('tapHint');
        bgMusic.volume = 0.8;

        const startMusicOnFirstTap = () => {
            document.removeEventListener('pointerdown', startMusicOnFirstTap);
            tapHint.style.opacity = '0';
            setTimeout(() => tapHint.remove(), 600);

            bgMusic.play().catch(() => initAudioWithFeedback());
        };
        bgMusic.addEventListener('error', () => {
            if (!tapHint.isConnected) {
                initAudioWithFeedback();
            }
        });
        document.addEventListener('pointerdown', startMusicOnFirstTap);

        // Bắt đầu animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
