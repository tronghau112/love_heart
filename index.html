<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>•͈ ₃ •͈꧞</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            cursor: crosshair;
        }
        canvas {
            border: none;
            background: black;
        }
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff69b4;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff69b4;
            z-index: 100;
        }
        .tap-hint {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffb6d9;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff69b4;
            z-index: 1000;
            pointer-events: none;
            animation: hintPulse 1.6s ease-in-out infinite;
            transition: opacity 0.6s ease;
        }
        @keyframes hintPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="title">💗💗💗</div>
    <canvas id="heartCanvas"></canvas>
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

    <script>
        let audioContext = null;
        let lastHeartbeatTime = 0;
        let heartbeatThreshold = 0.75;

        function initAudioWithFeedback() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    console.log('Đã khởi tạo audio context');
                    
                    setTimeout(() => {
                        if (audioContext) {
                            playHeartbeat();
                            console.log('Đã phát thử âm thanh nhịp tim');
                        }
                    }, 500);
                }
                return audioContext;
            } catch (error) {
                console.error('Khởi tạo âm thanh thất bại:', error);
                return null;
            }
        }

        function playHeartbeat() {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            createSimpleHeartbeat(now, 80, 0.1, 0.2);
            
            setTimeout(() => {
                if (audioContext) {
                    createSimpleHeartbeat(audioContext.currentTime, 120, 0.08, 0.15);
                }
            }, 150);
        }

        function createSimpleHeartbeat(startTime, baseFreq, volume, duration) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(baseFreq, startTime);
            oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, startTime + duration);
            
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function createReverbBuffer(duration, decay) {
            const sampleRate = audioContext.sampleRate;
            const length = sampleRate * duration;
            const impulse = audioContext.createBuffer(2, length, sampleRate);
            
            for (let channel = 0; channel < 2; channel++) {
                const channelData = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    const n = length - i;
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(n / length, decay);
                }
            }
            return impulse;
        }

        function playDreamyHeartbeat() {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            for (let i = 0; i < 3; i++) {
                const delay = i * 0.02;
                const freq = 60 + i * 15;
                const vol = 0.04 - i * 0.01;
                
                setTimeout(() => {
                    if (audioContext) {
                        createDreamyTone(audioContext.currentTime, freq, vol);
                    }
                }, delay * 1000);
            }
        }

        function createDreamyTone(startTime, frequency, volume) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            const delay = audioContext.createDelay();
            const delayGain = audioContext.createGain();
            
            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            gainNode.connect(delay);
            delay.connect(delayGain);
            delayGain.connect(gainNode);
            
            delay.delayTime.setValueAtTime(0.1, startTime);
            delayGain.gain.setValueAtTime(0.2, startTime);
            
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(frequency * 2, startTime);
            filter.Q.setValueAtTime(3, startTime);
            
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(frequency, startTime);
            oscillator.frequency.linearRampToValueAtTime(frequency * 0.8, startTime + 0.2);
            
            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
            
            oscillator.start(startTime);
            oscillator.stop(startTime + 0.4);
        }

        function playPianoHeartbeat() {
            if (!audioContext) return;
            
            const now = audioContext.currentTime;
            
            const notes = [110, 138.59, 164.81];
            
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    if (audioContext) {
                        createPianoNote(audioContext.currentTime, freq, 0.03 - index * 0.008);
                    }
                }, index * 30);
            });
        }

        function createPianoNote(startTime, frequency, volume) {
            const fundamental = audioContext.createOscillator();
            const harmonic2 = audioContext.createOscillator();
            const harmonic3 = audioContext.createOscillator();
            
            const gainNode = audioContext.createGain();
            const gain2 = audioContext.createGain();
            const gain3 = audioContext.createGain();
            const masterGain = audioContext.createGain();
            
            fundamental.connect(gainNode);
            gainNode.connect(masterGain);
            
            harmonic2.connect(gain2);
            gain2.connect(masterGain);
            harmonic3.connect(gain3);
            gain3.connect(masterGain);
            
            masterGain.connect(audioContext.destination);
            
            fundamental.frequency.setValueAtTime(frequency, startTime);
            harmonic2.frequency.setValueAtTime(frequency * 2, startTime);
            harmonic3.frequency.setValueAtTime(frequency * 3, startTime);
            
            fundamental.type = 'triangle';
            harmonic2.type = 'sine';
            harmonic3.type = 'sine';
            
            gainNode.gain.setValueAtTime(volume, startTime);
            gain2.gain.setValueAtTime(volume * 0.3, startTime);
            gain3.gain.setValueAtTime(volume * 0.1, startTime);
            
            masterGain.gain.setValueAtTime(0, startTime);
            masterGain.gain.linearRampToValueAtTime(1, startTime + 0.01);
            masterGain.gain.exponentialRampToValueAtTime(0.3, startTime + 0.1);
            masterGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.6);
            
            fundamental.start(startTime);
            harmonic2.start(startTime);
            harmonic3.start(startTime);
            
            fundamental.stop(startTime + 0.6);
            harmonic2.stop(startTime + 0.6);
            harmonic3.stop(startTime + 0.6);
        }

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 800;
        canvas.height = 600;
        
        const WIDTH = 800;
        const HEIGHT = 600;
        const BLACK = [0, 0, 0];
        const PINK = [255, 105, 180];
        const LIGHT_PINK = [255, 182, 193];
        const HOT_PINK = [255, 20, 147];
        const GALAXY_COLORS = [[180, 200, 255], [120, 160, 255], [255, 255, 255], [200, 120, 255]];
        const STAR_COLORS = [[255, 255, 255], [255, 255, 180], [180, 255, 255], [255, 180, 255], [180, 255, 180]];
        
        let angleY = 0;
        let pulse = 0;
        let lastTime = 0;
        let keys = {};
        
        function isIn3DHeart(x, z, y) {
            const scale = 0.7;
            x = x / scale;
            y = y / scale;
            z = z / scale;
            const term1 = (x * x + (9 * y * y) / 4.0 + z * z - 1);
            const value = term1 * term1 * term1 - x * x * z * z * z - (9 * y * y * z * z * z) / 80.0;
            return value <= 0;
        }
        
        function randomChoice(arr, weights = null) {
            if (!weights) {
                return arr[Math.floor(Math.random() * arr.length)];
            }
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let random = Math.random() * totalWeight;
            for (let i = 0; i < arr.length; i++) {
                random -= weights[i];
                if (random <= 0) return arr[i];
            }
            return arr[arr.length - 1];
        }
        
        const BOUQUET_TILT = 0.25;
        const HEART_HOLD = 4, MORPH_TIME = 2, BOUQUET_HOLD = 4;
        const MORPH_CYCLE = HEART_HOLD + MORPH_TIME + BOUQUET_HOLD + MORPH_TIME;
        let morph = 0;

        const DOME_CENTER_Y = 1.0;
        const DOME_RADIUS_XZ = 6.5;
        const DOME_RADIUS_Y = 4.5;
        const DOME_MAX_POLAR = Math.PI * 0.36;
        const TIE_Y = -5;
        const TIE_RADIUS = 1.2;
        const SKIRT_BOTTOM_Y = -10.5;
        const WRAP_PANELS = 7;
        const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

        const ROSE_REDS = [[150, 0, 30], [230, 25, 55]];
        const ROSE_RIM = [255, 70, 100];
        const LEAF_GREENS = [[70, 210, 120], [40, 160, 90]];
        const WHITE_FLOWER = [[255, 255, 255], [235, 235, 245]];
        const PAPER = [225, 200, 165];
        const PAPER_FOLD = [190, 160, 125];
        const PAPER_RIM = [245, 230, 205];
        const RIBBON_REDS = [[255, 30, 45], [220, 10, 30]];

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function lerpColor(c1, c2, t) {
            return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
        }

        function smoothstep(t) {
            return t * t * (3 - 2 * t);
        }

        function getMorph(timeSec) {
            const phase = timeSec % MORPH_CYCLE;
            if (phase < HEART_HOLD) return 0;
            if (phase < HEART_HOLD + MORPH_TIME) return smoothstep((phase - HEART_HOLD) / MORPH_TIME);
            if (phase < HEART_HOLD + MORPH_TIME + BOUQUET_HOLD) return 1;
            return 1 - smoothstep((phase - HEART_HOLD - MORPH_TIME - BOUQUET_HOLD) / MORPH_TIME);
        }

        function normalize(v) {
            const len = Math.hypot(v.x, v.y, v.z);
            return { x: v.x / len, y: v.y / len, z: v.z / len };
        }

        function cross(a, b) {
            return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
        }

        function domePoint(polar, azimuth, lift = 0) {
            const n = { x: Math.sin(polar) * Math.cos(azimuth), y: Math.cos(polar), z: Math.sin(polar) * Math.sin(azimuth) };
            return {
                pos: {
                    x: n.x * DOME_RADIUS_XZ + n.x * lift,
                    y: DOME_CENTER_Y + n.y * DOME_RADIUS_Y + n.y * lift,
                    z: n.z * DOME_RADIUS_XZ + n.z * lift
                },
                normal: n
            };
        }

        function domeSpots(count, phase) {
            const spots = [];
            for (let i = 0; i < count; i++) {
                const polar = Math.acos(1 - (1 - Math.cos(DOME_MAX_POLAR)) * (i + 0.5) / count);
                spots.push({ polar, azimuth: GOLDEN_ANGLE * i + phase });
            }
            return spots;
        }

        const ROSE_SPOTS = domeSpots(15, 0);
        const TULIP_SPOTS = domeSpots(7, 1.3);

        function placeOnFrame(origin, normal, lx, ly, lh) {
            const helper = Math.abs(normal.y) > 0.9 ? { x: 0, y: 0, z: 1 } : { x: 0, y: 1, z: 0 };
            const t1 = normalize(cross(helper, normal));
            const t2 = cross(normal, t1);
            return {
                x: origin.x + t1.x * lx + t2.x * ly + normal.x * lh,
                y: origin.y + t1.y * lx + t2.y * ly + normal.y * lh,
                z: origin.z + t1.z * lx + t2.z * ly + normal.z * lh
            };
        }

        function sampleRose() {
            const spot = randomChoice(ROSE_SPOTS);
            const { pos, normal } = domePoint(spot.polar, spot.azimuth);
            const radius = 1.75;
            let lx, ly, lh, color;
            if (Math.random() < 0.7) {
                const s = Math.sqrt(Math.random());
                const theta = s * 10 * Math.PI + spot.azimuth;
                const r = radius * s;
                lx = r * Math.cos(theta);
                ly = r * Math.sin(theta);
                lh = 0.5 * radius * (1 - s * s);
                color = lerpColor(ROSE_REDS[0], ROSE_REDS[1], s);
            } else {
                const theta = Math.random() * Math.PI * 2;
                const r = radius * (0.88 + 0.12 * Math.abs(Math.sin(2.5 * theta)));
                lx = r * Math.cos(theta);
                ly = r * Math.sin(theta);
                lh = 0;
                color = ROSE_RIM;
            }
            return { ...placeOnFrame(pos, normal, lx, ly, lh), color, size: 1 };
        }

        function sampleTulip() {
            const spot = randomChoice(TULIP_SPOTS);
            const { pos, normal } = domePoint(spot.polar, spot.azimuth, 0.6);
            if (Math.random() < 0.15) {
                const s = Math.random();
                return { ...placeOnFrame(pos, normal, 0, 0, -s * 1.2), color: randomChoice(LEAF_GREENS), size: 0.8 };
            }
            const phi = Math.random() * Math.PI * 2;
            const uMax = 1 - 0.12 * Math.abs(Math.cos(1.5 * phi));
            const u = Math.random() * uMax;
            const r = 0.55 * Math.sin(Math.PI * (0.2 + 0.7 * u));
            const point = placeOnFrame(pos, normal, r * Math.cos(phi), r * Math.sin(phi), 1.1 * u);
            return { ...point, color: randomChoice(WHITE_FLOWER), size: 0.9 };
        }

        function sampleBabyBreath() {
            const polar = Math.random() * DOME_MAX_POLAR * 0.75;
            const azimuth = Math.random() * Math.PI * 2;
            const { pos } = domePoint(polar, azimuth, 0.9);
            const jitter = () => (Math.random() - 0.5) * 0.7;
            return { x: pos.x + jitter(), y: pos.y + jitter(), z: pos.z + jitter(), color: [255, 255, 255], size: 0.55 };
        }

        function sampleLeaf() {
            const { pos } = domePoint(Math.random() * DOME_MAX_POLAR, Math.random() * Math.PI * 2, -0.3);
            return { ...pos, color: randomChoice(LEAF_GREENS), size: 0.9 };
        }

        function sampleWrapper() {
            const pick = Math.random();
            const onFold = pick < 0.1;
            const onRim = !onFold && pick < 0.35;
            const phi = onFold
                ? Math.floor(Math.random() * WRAP_PANELS) * 2 * Math.PI / WRAP_PANELS + (Math.random() - 0.5) * 0.04
                : Math.random() * Math.PI * 2;
            const frontness = (1 + Math.sin(phi)) / 2;
            const wave = Math.abs(Math.sin(phi * WRAP_PANELS / 2));
            const topY = lerp(7.5, -0.5, frontness) + 0.9 * wave;
            const topR = lerp(8.5, 7.5, frontness) + 0.5 * wave;
            const u = onRim ? 1 : Math.sqrt(Math.random());
            const r = lerp(TIE_RADIUS, topR, Math.pow(u, 0.9)) + 0.6 * Math.pow(u, 6);
            const color = onFold ? PAPER_FOLD : onRim ? PAPER_RIM : PAPER;
            return { x: r * Math.cos(phi), y: lerp(TIE_Y, topY, u), z: r * Math.sin(phi), color, size: 1 };
        }

        function sampleSkirt() {
            const phi = Math.random() * Math.PI * 2;
            const s = Math.random();
            const r = lerp(TIE_RADIUS, 3.2, s) + 0.4 * Math.sin(5 * phi) * s;
            const y = lerp(TIE_Y, SKIRT_BOTTOM_Y + 0.8 * Math.abs(Math.sin(3 * phi)), s);
            return { x: r * Math.cos(phi), y, z: r * Math.sin(phi), color: s > 0.95 ? PAPER_RIM : PAPER, size: 1 };
        }

        function sampleRibbon() {
            const pick = Math.random();
            const color = randomChoice(RIBBON_REDS);
            if (pick < 0.3) {
                const phi = Math.random() * Math.PI * 2;
                const r = TIE_RADIUS + 0.1;
                return { x: r * Math.cos(phi), y: TIE_Y + (Math.random() - 0.5) * 0.6, z: r * Math.sin(phi), color, size: 1.1 };
            }
            const side = Math.random() < 0.5 ? -1 : 1;
            if (pick < 0.7) {
                const a = Math.random() * Math.PI * 2;
                const band = 0.85 + Math.random() * 0.15;
                return {
                    x: side * (1.6 + 1.5 * Math.cos(a) * band),
                    y: TIE_Y + 0.4 + 0.8 * Math.sin(a) * band,
                    z: TIE_RADIUS + 0.3,
                    color,
                    size: 1.1
                };
            }
            const s = Math.random();
            return {
                x: side * (0.3 + 1.7 * s) + (Math.random() - 0.5) * 0.35,
                y: lerp(TIE_Y, TIE_Y - 5.5, s),
                z: TIE_RADIUS + 0.2,
                color,
                size: 1.1
            };
        }

        function sampleBouquetPoint() {
            const pick = Math.random();
            if (pick < 0.5) return sampleRose();
            if (pick < 0.58) return sampleTulip();
            if (pick < 0.64) return sampleBabyBreath();
            if (pick < 0.68) return sampleLeaf();
            if (pick < 0.88) return sampleWrapper();
            if (pick < 0.93) return sampleSkirt();
            return sampleRibbon();
        }

        class Particle {
            constructor() {
                this.reset();
                this.target = sampleBouquetPoint();
                const a = Math.random() * Math.PI * 2;
                const b = Math.acos(Math.random() * 2 - 1);
                this.scatter = { x: Math.sin(b) * Math.cos(a), y: Math.sin(b) * Math.sin(a), z: Math.cos(b) };
            }
            
            reset() {
                let x, y, z;
                do {
                    x = Math.random() * 3 - 1.5;
                    y = Math.random() * 3 - 1.5;
                    z = Math.random() * 3 - 1.5;
                } while (!isIn3DHeart(x, y, z));
                
                this.x = x * 12;
                this.y = y * 12;
                this.z = z * 12;
                this.dx = (Math.random() - 0.5) * 0.04;
                this.dy = (Math.random() - 0.5) * 0.04;
                this.dz = (Math.random() - 0.5) * 0.04;
                this.baseColor = randomChoice([PINK, LIGHT_PINK, HOT_PINK], [0.5, 0.3, 0.2]);
                this.baseSize = Math.random() * 1.7 + 1.5;
            }
            
            update(angleY, pulseScale) {
                this.x += this.dx;
                this.y += this.dy;
                this.z += this.dz;
                
                if (!isIn3DHeart(this.x / 12, this.y / 12, this.z / 12)) {
                    this.reset();
                }
                
                const cosY = Math.cos(angleY);
                const sinY = Math.sin(angleY);
                const heartX = this.x * cosY + this.z * sinY;
                const heartZ = -this.x * sinY + this.z * cosY;

                const sway = 0.4 * Math.sin(lastTime * 0.0005);
                const cosS = Math.cos(sway);
                const sinS = Math.sin(sway);
                const flowerX = this.target.x * cosS + this.target.z * sinS;
                const flowerZFlat = -this.target.x * sinS + this.target.z * cosS;
                const flowerY = this.target.y * Math.cos(BOUQUET_TILT) - flowerZFlat * Math.sin(BOUQUET_TILT);
                const flowerZ = flowerZFlat * Math.cos(BOUQUET_TILT) + this.target.y * Math.sin(BOUQUET_TILT);

                const spread = Math.sin(Math.PI * morph) * 5;
                const xRot = lerp(heartX, flowerX, morph) + this.scatter.x * spread;
                const yRot = lerp(this.y, flowerY, morph) + this.scatter.y * spread;
                const zRot = lerp(heartZ, flowerZ, morph) + this.scatter.z * spread;

                const flowerBreath = 1 + 0.02 * Math.sin(lastTime * 0.0015);
                const scale = 25 * lerp(pulseScale, flowerBreath, morph);
                const distance = 20;
                const xProj = WIDTH / 2 + (xRot * scale);
                const yProj = HEIGHT / 2 - (yRot * scale);
                const depthFactor = (zRot + distance) / (2 * distance);

                const currSize = Math.max(1.2, this.baseSize * depthFactor * 1.5 * lerp(1, this.target.size, morph));
                const colorFactor = Math.min(1.0, Math.max(0.35, depthFactor * 1.6));
                const color = lerpColor(this.baseColor, this.target.color, morph);

                const r = Math.min(255, Math.max(0, color[0] * colorFactor));
                const g = Math.min(255, Math.max(0, color[1] * colorFactor));
                const b = Math.min(255, Math.max(0, color[2] * colorFactor));
                
                return {
                    x: xProj,
                    y: yProj,
                    size: currSize,
                    color: [r, g, b],
                    depth: depthFactor
                };
            }
            
            draw(ctx, angleY, pulseScale) {
                const result = this.update(angleY, pulseScale);
                if (result.x >= 0 && result.x < WIDTH && result.y >= 0 && result.y < HEIGHT) {
                    const alpha = 0.3 + 0.7 * result.depth;
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = `rgb(${Math.floor(result.color[0])}, ${Math.floor(result.color[1])}, ${Math.floor(result.color[2])})`;
                    ctx.beginPath();
                    ctx.arc(result.x, result.y, result.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }
        
        class GalaxyParticle {
            constructor() {
                this.x = Math.random() * WIDTH;
                this.y = Math.random() * HEIGHT;
                this.z = Math.random() * 60 - 30;
                this.size = Math.random() * 2 + 1;
                this.color = randomChoice(GALAXY_COLORS);
                this.baseAlpha = Math.random() * 208 + 12;
                this.alpha = this.baseAlpha;
                this.speed = Math.random() * 1 + 0.5;
                this.angle = Math.random() * 0.4 - 0.2;
                this.life = Math.random() * 60 + 60;
                this.fadeSpeed = Math.random() * 0.02 + 0.01;
            }
            
            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.angle) * 0.5;
                this.size = Math.max(0, this.size - this.fadeSpeed);
                this.life -= 1;
                
                if (this.life < 30) {
                    this.alpha = this.alpha * this.life / 30;
                }
                
                return this.life > 0 && this.y > 0 && this.size > 0;
            }
            
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha / 255;
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        class ParticleDrop {
            constructor(heartParticles, angleY, pulse) {
                const sourceParticle = heartParticles[Math.floor(Math.random() * heartParticles.length)];
                const result = sourceParticle.update(angleY, pulse);
                this.x = result.x + (Math.random() - 0.5) * 160;
                this.y = result.y + 50;
                this.color = result.color;
                this.size = Math.random() * 1.5 + 1.5;
                this.speed = Math.random() * 2 + 1;
                this.alpha = Math.random() * 75 + 180;
                this.fadeSpeed = Math.random() * 1.5 + 1;
                this.horizontalSpeed = (Math.random() - 0.5);
                this.trail = [];
            }
            
            update() {
                this.y += this.speed;
                this.x += this.horizontalSpeed;
                this.alpha = Math.max(0, this.alpha - this.fadeSpeed);
                
                this.trail.push({
                    x: this.x,
                    y: this.y,
                    size: this.size,
                    alpha: this.alpha
                });
                
                if (this.trail.length > 5) {
                    this.trail.shift();
                }
                
                return this.alpha > 0 && this.y < HEIGHT + 20;
            }
            
            draw(ctx) {
                this.trail.forEach((point, index) => {
                    const fade = point.alpha * (index + 1) / this.trail.length;
                    const size = Math.max(1, point.size * (index + 1) / this.trail.length);
                    
                    ctx.save();
                    ctx.globalAlpha = fade / 255;
                    ctx.fillStyle = `rgb(${Math.floor(this.color[0])}, ${Math.floor(this.color[1])}, ${Math.floor(this.color[2])})`;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
                
                ctx.save();
                ctx.globalAlpha = this.alpha / 255;
                ctx.fillStyle = `rgb(${Math.floor(this.color[0])}, ${Math.floor(this.color[1])}, ${Math.floor(this.color[2])})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        class FallingHeartParticle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * (WIDTH + 200) - 100;
                this.y = -20;
                this.vx = (Math.random() - 0.7) * 2;
                this.vy = Math.random() * 3 + 2;
                this.size = Math.random() * 12 + 8;
                this.color = randomChoice([PINK, LIGHT_PINK, HOT_PINK], [0.4, 0.4, 0.2]);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
                this.alpha = Math.random() * 0.8 + 0.2;
                this.trail = [];
                this.life = Math.random() * 200 + 300;
                this.maxLife = this.life;
                this.twinkle = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.twinkle += 0.15;
                this.life -= 1;
                
                this.trail.push({
                    x: this.x,
                    y: this.y,
                    size: this.size * 0.6,
                    alpha: this.alpha * 0.3
                });
                
                if (this.trail.length > 8) {
                    this.trail.shift();
                }
                
                if (this.y > HEIGHT + 50 || this.x < -100 || this.x > WIDTH + 100 || this.life <= 0) {
                    this.reset();
                }
                
                return true;
            }
            
            draw(ctx) {
                this.trail.forEach((point, index) => {
                    const trailAlpha = point.alpha * (index + 1) / this.trail.length;
                    const trailSize = point.size * (index + 1) / this.trail.length;
                    
                    ctx.save();
                    ctx.globalAlpha = trailAlpha;
                    ctx.translate(point.x, point.y);
                    ctx.scale(trailSize / 10, trailSize / 10);
                    
                    ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                    ctx.beginPath();
                    ctx.moveTo(0, 3);
                    ctx.bezierCurveTo(-5, -2, -10, 1, -5, 6);
                    ctx.bezierCurveTo(-3, 8, 0, 10, 0, 10);
                    ctx.bezierCurveTo(0, 10, 3, 8, 5, 6);
                    ctx.bezierCurveTo(10, 1, 5, -2, 0, 3);
                    ctx.fill();
                    
                    ctx.restore();
                });
                
                const twinkleEffect = 0.8 + 0.2 * Math.sin(this.twinkle);
                
                ctx.save();
                ctx.globalAlpha = this.alpha * twinkleEffect;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.size / 10, this.size / 10);
                
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.moveTo(0, 3);
                ctx.bezierCurveTo(-5, -2, -10, 1, -5, 6);
                ctx.bezierCurveTo(-3, 8, 0, 10, 0, 10);
                ctx.bezierCurveTo(0, 10, 3, 8, 5, 6);
                ctx.bezierCurveTo(10, 1, 5, -2, 0, 3);
                ctx.fill();
                
                ctx.globalAlpha = this.alpha * twinkleEffect * 0.3;
                ctx.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.shadowBlur = 15;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        class ClickStarParticle {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 100;
                this.y = y + (Math.random() - 0.5) * 100;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8 - Math.random() * 3;
                this.size = Math.random() * 4 + 2;
                this.color = randomChoice(STAR_COLORS);
                this.life = Math.random() * 60 + 120;
                this.maxLife = this.life;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.twinkle = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.vx *= 0.99;
                this.life -= 1;
                this.rotation += this.rotationSpeed;
                this.twinkle += 0.2;
                
                return this.life > 0;
            }
            
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                const twinkleAlpha = alpha * (0.7 + 0.3 * Math.sin(this.twinkle));
                
                ctx.save();
                ctx.globalAlpha = twinkleAlpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                
                for (let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const x = Math.cos(angle) * this.size;
                    const y = Math.sin(angle) * this.size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                    
                    const innerAngle = ((i + 0.5) * Math.PI * 2) / 5 - Math.PI / 2;
                    const innerX = Math.cos(innerAngle) * this.size * 0.4;
                    const innerY = Math.sin(innerAngle) * this.size * 0.4;
                    ctx.lineTo(innerX, innerY);
                }
                ctx.closePath();
                ctx.fill();
                
                ctx.globalAlpha = twinkleAlpha * 0.3;
                ctx.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.shadowBlur = 10;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        class ClickHeartParticle {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 50;
                this.y = y + (Math.random() - 0.5) * 50;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = -Math.random() * 8 - 2;
                this.size = Math.random() * 8 + 6;
                this.color = randomChoice([PINK, LIGHT_PINK, HOT_PINK]);
                this.life = Math.random() * 40 + 80;
                this.maxLife = this.life;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15;
                this.vx *= 0.98;
                this.life -= 1;
                this.rotation += this.rotationSpeed;
                
                return this.life > 0;
            }
            
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.size / 10, this.size / 10);
                
                ctx.fillStyle = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.beginPath();
                ctx.moveTo(0, 3);
                ctx.bezierCurveTo(-5, -2, -10, 1, -5, 6);
                ctx.bezierCurveTo(-3, 8, 0, 10, 0, 10);
                ctx.bezierCurveTo(0, 10, 3, 8, 5, 6);
                ctx.bezierCurveTo(10, 1, 5, -2, 0, 3);
                ctx.fill();
                
                ctx.globalAlpha = alpha * 0.3;
                ctx.shadowColor = `rgb(${this.color[0]}, ${this.color[1]}, ${this.color[2]})`;
                ctx.shadowBlur = 8;
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        const particles = [];
        for (let i = 0; i < 3000; i++) {
            particles.push(new Particle());
        }
        
        let galaxyParticles = [];
        let dropParticles = [];
        let clickStars = [];
        let clickHearts = [];
        let fallingHearts = [];
        
        for (let i = 0; i < 15; i++) {
            fallingHearts.push(new FallingHeartParticle());
        }
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let i = 0; i < 15; i++) {
                clickStars.push(new ClickStarParticle(x, y));
            }
            
            for (let i = 0; i < 8; i++) {
                clickHearts.push(new ClickHeartParticle(x, y));
            }
        });
        
        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            if (keys['ArrowLeft']) {
                angleY -= 0.05;
            }
            if (keys['ArrowRight']) {
                angleY += 0.05;
            }
            
            angleY += 0.01;
            
            const time = currentTime * 0.001;
            const heartbeat1 = Math.sin(time * 4) * 0.15;
            const heartbeat2 = Math.sin(time * 8) * 0.05;
            const slowPulse = Math.sin(time * 1.5) * 0.1;
            const prevPulse = pulse;
            pulse = 0.85 + heartbeat1 + heartbeat2 + slowPulse;
            morph = getMorph(time);
               
            if (audioContext && pulse > heartbeatThreshold && prevPulse <= heartbeatThreshold) {
                const timeSinceLastBeat = currentTime - lastHeartbeatTime;
                if (timeSinceLastBeat > 400) {
                    const heartbeatType = Math.floor(Math.random() * 3);
                    switch(heartbeatType) {
                        case 0:
                            playHeartbeat();
                            break;
                        case 1:
                            playDreamyHeartbeat();
                            break;
                        case 2:
                            playPianoHeartbeat();
                            break;
                    }
                    lastHeartbeatTime = currentTime;
                }
            }

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            ctx.save();
            ctx.globalAlpha = 0.1;
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.restore();
            
            if (Math.random() < 0.6) {
                galaxyParticles.push(new GalaxyParticle());
            }
            
            if (dropParticles.length < 300 && Math.random() < 0.95) {
                dropParticles.push(new ParticleDrop(particles, angleY, pulse));
            }
            
            galaxyParticles = galaxyParticles.filter(p => p.update());
            galaxyParticles.forEach(p => p.draw(ctx));
            
            dropParticles = dropParticles.filter(p => p.update());
            dropParticles.forEach(p => p.draw(ctx));
            
            fallingHearts.forEach(heart => {
                heart.update();
                heart.draw(ctx);
            });
            
            clickStars = clickStars.filter(star => star.update());
            clickStars.forEach(star => star.draw(ctx));
            
            clickHearts = clickHearts.filter(heart => heart.update());
            clickHearts.forEach(heart => heart.draw(ctx));
            
            particles.forEach(particle => {
                particle.draw(ctx, angleY, pulse);
            });
            
            requestAnimationFrame(animate);
        }

        const bgMusic = document.getElementById('bgMusic');
        const tapHint = document.getElementById('tapHint');
        const unlockEvents = ['click', 'touchend', 'keydown'];
        bgMusic.volume = 0.8;

        const onMusicStarted = () => {
            unlockEvents.forEach(evt => document.removeEventListener(evt, tryPlayMusic));
            if (tapHint) {
                tapHint.style.opacity = '0';
                setTimeout(() => tapHint.remove(), 600);
            }
        };

        function tryPlayMusic() {
            bgMusic.play()
                .then(onMusicStarted)
                .catch(err => {
                    console.warn('Chưa phát được nhạc:', err.name, err.message);
                    if (err.name === 'NotSupportedError' && navigator.userActivation?.isActive) {
                        initAudioWithFeedback();
                    }
                });
        }

        unlockEvents.forEach(evt => document.addEventListener(evt, tryPlayMusic));
        tryPlayMusic();

        requestAnimationFrame(animate);
    </script>
</body>
